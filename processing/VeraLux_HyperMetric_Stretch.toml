
[repo]
kind = "recipe"

[recipe]
# Note: this experiment is mostly Riccardo's code, starbash toml file and some tweaks in the py file excluded...
author.name = "Riccardo Paterniti"
author.email = "info@veralux.space"

[[stages]]

# this stage is considered if the previous stage in this same array
# was run.  It must be run inside the same tempdir (so that files from previous stage are available)

name = "veralux"
description = "Do VeraLux HyperMetric Stretching"
tool.name = "python"

# if not specified starbash.py used
script-file = "VeraLux_HyperMetric_Stretch.py"

[[stages.inputs]]
kind = "job"
after = "(starnet|palette_broadband).*" # the name of the step we want to follow (FIXME was after |noise_exterminator)
multiplex = true # one task per upstream file, so multi-file stacks (e.g. Ha/OIII) each get stretched

[[stages.inputs.requires]]
kind = "min_count"
value = 1          # At this point if we don't have any valid inputs, reject this stage from consideration

[[stages.inputs.requires]]
kind = "filename"
value = "starmask"
mode = "exclude" # exclude any starmask files from consideration

# Based on the following definitions in the stage toml file...
# Note: outputs will be prefilled in the context so that the script can use them
[[stages.outputs]]
# the 'processed' output points to a directory in the 'processed' repo but named based on the target we are trying to build for
# see above for a rule that automatically populates the results_dir shorthand
kind = "processed"

# if used: Generated output filenames will be based on the input filename, but with this prefix
auto.prefix = "hms_"


[[stages.parameters]]
name = "background"
default = 0.10 # Value used if not overriden
description = "What background level should be targeted for VeraLux HyperMetric Stretch"

[[stages.parameters]]
name = "log_d"
default = 0.0 # 0.0 means auto-calculate from the background target
description = "Stretch (Log D): hyperbolic intensity. Higher = brighter midtones."

[[stages.parameters]]
name = "protect_b"
default = 6.0
description = "Highlight Protection (b): controls the stretch curve 'knee'. Higher (>6.0) protects stars from bloating; lower (<2.0) gives brighter highlights but risks bloating."

[[stages.parameters]]
name = "star_recovery"
default = 3.5
description = "Star Recovery (White Point): color convergence. Determines how fast a saturated core fades to pure white; increase to fix 'donut' artifacts or holes in stars."

[[stages.parameters]]
name = "color_grip"
default = 1.0
description = "Color Grip: vector strictness in highlights. 1.0 = pure vector (vivid); < 1.0 = hybrid (softer stars)."

